<script>
let currentIndex = 0;
let images = [];
let preloadedImages = [];

 
function initGallery() {
  images = Array.from(document.querySelectorAll(".gallery-grid img"));

  images.forEach((img, index) => {
    img.addEventListener("click", () => openLightbox(index));
  });

  
  window.addEventListener("load", () => {
    if ("requestIdleCallback" in window) {
      requestIdleCallback(preloadLightboxImages);
    } else {
      setTimeout(preloadLightboxImages, 1000);
    }
  });
}

 
function preloadLightboxImages() {
  images.forEach((img) => {
    const fullSrc = img.dataset.full || img.src;

    const preloadImg = new Image();
    preloadImg.src = fullSrc;

    preloadedImages.push(preloadImg);
  });
}

 
function preloadAdjacentImages() {
  const next = (currentIndex + 1) % images.length;
  const prev = (currentIndex - 1 + images.length) % images.length;

  [next, prev].forEach((i) => {
    const preloadImg = new Image();
    preloadImg.src = images[i].dataset.full || images[i].src;
  });
}

 
function openLightbox(index) {
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  currentIndex = index;

  const img = images[index];
  lightboxImg.src = img.dataset.full || img.src;

  lightbox.classList.add("active");

  preloadAdjacentImages();
}

 
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("active");
}

 
function nextImage() {
  currentIndex = (currentIndex + 1) % images.length;
  updateImage();
}

 
function prevImage() {
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  updateImage();
}

 
function updateImage() {
  const img = images[currentIndex];

  document.getElementById("lightbox-img").src =
    img.dataset.full || img.src;

  preloadAdjacentImages();
}

 
document.getElementById("lightbox").addEventListener("click", (e) => {
  if (e.target.id === "lightbox") {
    closeLightbox();
  }
});

 
document.addEventListener("keydown", (e) => {
  const lightbox = document.getElementById("lightbox");

  if (!lightbox.classList.contains("active")) return;

  if (e.key === "ArrowRight") nextImage();
  if (e.key === "ArrowLeft") prevImage();
  if (e.key === "Escape") closeLightbox();
});

 
let startX = 0;

document.getElementById("lightbox").addEventListener("touchstart", (e) => {
  startX = e.touches[0].clientX;
});

document.getElementById("lightbox").addEventListener("touchend", (e) => {
  const endX = e.changedTouches[0].clientX;
  const diff = startX - endX;

  if (Math.abs(diff) > 50) {
    if (diff > 0) {
      nextImage(); 
    } else {
      prevImage(); 
    }
  }
});

 
window.addEventListener("DOMContentLoaded", initGallery);
</script>
