<section id="faq" class="section">
  <div class="container narrow">
    <h2>{{ .Params.faq.heading }}</h2>
    <div class="faq-list">
      {{ range .Params.faq.items }}
      <details class="faq-item">
        <summary>{{ .question }}</summary>
        <p>{{ .answer }}</p>
      </details>
      {{ end }}
    </div>
  </div>
</section>
