<dialog id="lightbox" class="lightbox" aria-label="Image gallery">
  <button type="button" class="lightbox-close" aria-label="Close gallery" autofocus>×</button>
  <button type="button" class="lightbox-nav left" aria-label="Previous image">‹</button>
  <img id="lightbox-img" alt="">
  <button type="button" class="lightbox-nav right" aria-label="Next image">›</button>
</dialog>
{{ with resources.Get "js/gallery.js" | fingerprint }}
<script src="{{ .RelPermalink }}" integrity="{{ .Data.Integrity }}" defer></script>
{{ end }}
