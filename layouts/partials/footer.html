<footer class="site-footer">
  <div class="container footer-inner">
    <div class="footer-copyright-social">
      <p>© {{ now.Format "2006" }} {{ .Site.Title }}</p>
      <p class="footer-social">
        <span>Follow us</span>
        <a href="{{ .Site.Params.instagram }}" target="_blank" rel="noopener noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none" />
          </svg>
          Instagram
        </a>
        {{ with .Site.Params.tiktok }}
          <a href="{{ . }}" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
              <path d="M16.6 3c.4 2.3 1.7 3.7 4.4 3.9v3.2a8.2 8.2 0 0 1-4.4-1.3v6.5a6 6 0 1 1-5.2-5.9v3.3a2.7 2.7 0 1 0 1.9 2.6V3z" />
            </svg>
            TikTok
          </a>
        {{ end }}
        {{ with .Site.Params.youtube }}
          <a href="{{ . }}" target="_blank" rel="noopener noreferrer" aria-label="YouTube Shorts">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" focusable="false">
              <rect x="2" y="5" width="20" height="14" rx="4" />
              <path d="m10 9 5 3-5 3z" fill="currentColor" stroke="none" />
            </svg>
            YouTube
          </a>
        {{ end }}
      </p>
    </div>
    <div class="footer-tagline">
      <p>Sunset Studios Gran Canaria · Where artists, songwriters, and producers come to create</p>
      <p class="footer-legal"><a href="/privacy/">Privacy policy</a> · <button type="button" class="cookie-settings-link" data-cookie-settings>Cookie settings</button></p>
    </div>
  </div>
</footer>
